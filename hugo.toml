baseURL = "https://andresguzco.github.io/"
languageCode = "en-us"
title = "Andrés Guzmán-Cordero"

copyright = "&copy; 2026 Andrés Guzmán-Cordero"

[params]
  mainSections = ["posts"]
  tagline = "Machine learning researcher working on quantum many-body problems."

  [params.head]
    author = "Andrés Guzmán-Cordero"
    description = "Andrés Guzmán-Cordero, computer science PhD student at Mila applying machine learning and deep learning to quantum many-body problems and electronic structure calculations."
    keywords = ["Andrés Guzmán-Cordero", "machine learning", "deep learning", "quantum many-body problems", "electronic structure", "density functional theory", "Mila"]

  [params.author]
    # Used to bold your own name in author lists.
    name = "Andrés Guzmán-Cordero"
    photo = "/images/prof_pic.jpeg"

  [params.typography]
    title_font = "Space Grotesk"
    body_font = "Space Grotesk"
    mono_font = "Space Mono"

  [params.sections]
    show_news = true

  [params.footer]
    show_footer = true

  # Sidebar profile links. `icon` maps to an inline SVG in partials/icon.html.
  [params.social]
    [params.social.email]
      name = "Email"
      icon = "mail"
      url = "mailto:andres.guzman-cordero@mila.quebec"
      weight = 1
    [params.social.scholar]
      name = "Google Scholar"
      icon = "scholar"
      url = "https://scholar.google.com/citations?user=mQI7UcgAAAAJ&hl=en"
      external = true
      weight = 2
    [params.social.github]
      name = "GitHub"
      icon = "github"
      url = "https://github.com/andresguzco"
      external = true
      weight = 3
    # Drop a PDF at static/cv.pdf (or images/cv.pdf) and uncomment:
    # [params.social.cv]
    #   name = "Academic CV"
    #   icon = "doc"
    #   url = "/cv.pdf"
    #   external = true
    #   weight = 4

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$']]
          inline = [['$', '$']]

[module]
  [module.hugoVersion]
    extended = true
    min = "0.128.0"
  [[module.mounts]]
    source = "images"
    target = "static/images"
