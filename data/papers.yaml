# `tldr` carries the plain-language claims, two or three per paper.
# `summary` fills the collapsible "More" panel and holds the published abstract.
# `post` is retained but not rendered; the write-up links are off pending a Substack.

- title: "Improving Energy Natural Gradient Descent through Woodbury, Momentum, and Randomization"
  authors: "Andrés Guzmán-Cordero, Felix Dangel, Gil Goldshlager, Marius Zeinhofer"
  year: 2025
  venue: "NeurIPS"
  venue_full: "Conference on Neural Information Processing Systems"
  url: "https://arxiv.org/abs/2505.12149"
  pdf: "https://arxiv.org/pdf/2505.12149.pdf"
  post: "/posts/energy-ngd/"
  preview: "sphere.png"
  tldr:
    - "The ENGD curvature matrix is built from residual Jacobians, so the Woodbury formula rewrites the solve in sample space instead of parameter space. This reaches the same L² error as the original ENGD up to 75× faster."
    - "Adapting SPRING (Subsampled Projected-Increment Natural Gradient Descent) from the variational Monte Carlo literature accelerates convergence and removes the line search that standard ENGD requires."
    - "Randomized solvers help in the early stages of training on low-dimensional problems. We identify the barriers to obtaining the same acceleration in other settings."
  summary: >
    Natural gradient methods significantly accelerate the training of Physics-Informed
    Neural Networks (PINNs), but are often prohibitively costly. We introduce a suite of
    techniques to improve the accuracy and efficiency of energy natural gradient descent
    (ENGD) for PINNs. First, we leverage the Woodbury formula to dramatically reduce the
    computational complexity of ENGD. Second, we adapt the Subsampled Projected-Increment
    Natural Gradient Descent algorithm from the variational Monte Carlo literature to
    accelerate the convergence. Third, we explore the use of randomized algorithms to
    further reduce the computational cost in the case of large batch sizes. We find that
    randomization accelerates progress in the early stages of training for low-dimensional
    problems, and we identify key barriers to attaining acceleration in other scenarios.
    Our numerical experiments demonstrate that our methods outperform previous approaches,
    achieving the same L² error as the original ENGD up to 75× faster.

- title: "Exponential Family Variational Flow Matching for Tabular Data Generation"
  authors: "Andrés Guzmán-Cordero, Floor Eijkelboom, Jan-Willem van de Meent"
  year: 2025
  venue: "ICML"
  venue_full: "International Conference on Machine Learning"
  url: "https://arxiv.org/abs/2506.05940"
  pdf: "https://arxiv.org/pdf/2506.05940.pdf"
  post: "/posts/ef-vfm/"
  preview: "vi.png"
  tldr:
    - "Exponential Family Variational Flow Matching represents mixed continuous and discrete features with a single exponential family, so tabular data needs no continuous relaxation of its discrete columns."
    - "The resulting objective is moment matching, which we connect to generalized flow matching objectives based on Bregman divergences. TabbyFlow, built on this formulation, reaches state of the art on tabular benchmarks."
  summary: >
    While denoising diffusion and flow matching have driven major advances in generative
    modeling, their application to tabular data remains limited, despite its ubiquity in
    real-world applications. To this end, we develop TabbyFlow, a variational Flow Matching
    (VFM) method for tabular data generation. To apply VFM to data with mixed continuous
    and discrete features, we introduce Exponential Family Variational Flow Matching
    (EF-VFM), which represents heterogeneous data types using a general exponential family
    distribution. We hereby obtain an efficient, data-driven objective based on moment
    matching, enabling principled learning of probability paths over mixed continuous and
    discrete variables. We also establish a connection between variational flow matching
    and generalized flow matching objectives based on Bregman divergences. Evaluation on
    tabular data benchmarks demonstrates state-of-the-art performance compared to baselines.

- title: "Spiers Memorial Lecture: How to do impactful research in artificial intelligence for chemistry and materials science"
  authors: "Austin H. Cheng, Cher Tian Ser, Marta Skreta, Andrés Guzmán-Cordero, Luca Thiede, Andreas Burger, Abdulrahman Aldossary, Shi Xuan Leong, Sergio Pablo-García, Felix Strieth-Kalthoff, Alán Aspuru-Guzik"
  year: 2025
  venue: "Faraday Discussions"
  venue_full: "Faraday Discussions, 256, 10–60"
  url: "http://dx.doi.org/10.1039/D4FD00153B"
  doi: "10.1039/D4FD00153B"
  preview: "faraday.jpg"
  tldr:
    - "Sets out how machine learning researchers view and approach problems in chemistry and materials science."
    - "Gives our considerations for maximizing impact when doing machine learning research for chemistry."
  summary: >
    We discuss how machine learning researchers view and approach problems in chemistry
    and provide our considerations for maximizing impact when researching machine learning
    for chemistry.

- title: "Dimension Debate: Is 3D a Step Too Far for Optimizing Molecules?"
  authors: "Andrés Guzmán-Cordero, Luca A. Thiede, Gary Tom, Alán Aspuru-Guzik, Felix Strieth-Kalthoff, Agustinus Kristiadi"
  year: 2024
  venue: "AI4Mat @ NeurIPS"
  venue_full: "AI for Accelerated Materials Design Workshop, NeurIPS"
  pdf: "https://openreview.net/pdf?id=AnPEfzBstD"
  post: "/posts/3d-molecules/"
  preview: "3dbayes.jpg"
  tldr:
    - "Compares 1D, 2D and 3D molecular representations inside a Bayesian optimization loop, scored by optimization progress rather than by predictive accuracy. 1D and 2D representations generally win."
    - "3D surrogates need on the order of 10,000 observations before closing the gap to 2D baselines, which exceeds the budget Bayesian optimization is meant to operate under. Transfer learning narrows the gap but does not reverse the ordering."
  summary: >
    Molecules are three-dimensional objects, so it is tempting to assume that 3D
    representations should dominate 1D and 2D ones for molecular discovery. We test that
    assumption inside a Bayesian optimization loop, where what matters is not
    representation faithfulness but whether the induced posterior finds high-value
    molecules in few expensive evaluations. Comparing Gaussian processes against neural
    surrogates with a linearized Laplace approximation, and scoring by normalized GAP,
    we find that richer geometry adds cost faster than it adds decision-making power.
