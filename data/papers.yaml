  authors: "Austin H. Cheng, Cher Tian Ser, Marta Skreta, Andrés Guzmán-Cordero, Luca Thiede, Andreas Burger, Abdulrahman Aldossary, Shi Xuan Leong, Sergio Pablo-García, Felix Strieth-Kalthoff, Alán Aspuru-Guzik"
  year: 2025
  venue: "Faraday Discussions"
  venue_full: "Faraday Discussions, 256, 10–60"
  url: "http://dx.doi.org/10.1039/D4FD00153B"
  doi: "10.1039/D4FD00153B"
  preview: "faraday.jpg"
  tldr:
    - "A perspective on where machine learning actually moves the needle in chemistry and materials science — and where it mostly produces benchmark numbers."
    - "Argues for choosing problems by their scientific consequence rather than by the availability of a clean dataset."

- title: "Dimension Debate: Is 3D a Step Too Far for Optimizing Molecules?"
  authors: "Andrés Guzmán-Cordero, Luca A. Thiede, Gary Tom, Alán Aspuru-Guzik, Felix Strieth-Kalthoff, Agustinus Kristiadi"
  year: 2024
  venue: "AI4Mat @ NeurIPS"
  venue_full: "AI for Accelerated Materials Design Workshop, NeurIPS"
  pdf: "https://openreview.net/pdf?id=AnPEfzBstD"
  post: "/posts/3d-molecules/"
  preview: "3dbayes.jpg"
  tldr:
    - "1D and especially 2D molecular representations usually beat 3D ones inside a Bayesian optimization loop — 3D does not generally justify its cost."
    - "3D surrogates are dramatically more sample-hungry, sometimes needing >10,000 observations to catch strong 2D baselines, which is prohibitive in the small-data regime BO is built for."
  summary: >
    Molecules are 3D objects, so it is tempting to assume 3D representations should
    dominate. We test that assumption decision-theoretically: what matters in Bayesian
    optimization is not representation faithfulness but whether the induced posterior
    helps the surrogate find high-value molecules in few expensive evaluations. Comparing
    Gaussian processes against neural surrogates with a linearized Laplace approximation,
    and scoring by normalized GAP, richer geometry consistently adds cost faster than it
    adds useful decision-making power. Transfer learning narrows the gap but does not
    close it.
