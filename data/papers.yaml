# `tldr` is the most valuable field on the page: two plain-language bullets so a
# reader knows what the paper did without opening anything.
# `summary` fills the collapsible "▸ More" panel — swap in the real abstract if
# you'd rather show that.

- title: "Improving Energy Natural Gradient Descent through Woodbury, Momentum, and Randomization"
  authors: "Andrés Guzmán-Cordero, Felix Dangel, Gil Goldshlager, Marius Zeinhofer"
  year: 2025
  venue: "NeurIPS"
  venue_full: "Conference on Neural Information Processing Systems"
  url: "https://arxiv.org/abs/2505.12149"
  pdf: "https://arxiv.org/pdf/2505.12149.pdf"
  post: "/posts/energy-ngd/"
  preview: "sphere.png"
  tldr:
    - "The Woodbury identity moves the energy natural-gradient solve out of parameter space and into sample space, giving a >30× speedup per iteration on 5D Poisson while *improving* optimization quality."
    - "SPRING-style momentum removes the expensive line search, and a GPU-friendly randomized Nyström sketch keeps large batches affordable."
  summary: >
    Natural-gradient methods help PINNs train through badly conditioned landscapes,
    but the curvature matrix lives in parameter space and is usually too expensive to
    use. We observe that this curvature is not arbitrary — it is built from Jacobians
    of PDE residuals, so it carries hidden low-rank structure. The push-through identity
    exposes it, rewriting the solve in terms of an N×N kernel matrix instead of a
    P×P curvature matrix and computing the same ENGD direction far more cheaply.
    On top of that, SPRING transports curvature information across iterations, and a
    Cholesky-based Nyström approximation avoids SVDs when batches grow large.

- title: "Exponential Family Variational Flow Matching for Tabular Data Generation"
  authors: "Andrés Guzmán-Cordero, Floor Eijkelboom, Jan-Willem van de Meent"
  year: 2025
  venue: "ICML"
  venue_full: "International Conference on Machine Learning"
  url: "https://arxiv.org/abs/2506.05940"
  pdf: "https://arxiv.org/pdf/2506.05940.pdf"
  post: "/posts/ef-vfm/"
  preview: "vi.png"
  tldr:
    - "Model each column of a mixed-type table with its own exponential family — Gaussian, Bernoulli, Categorical — so flow matching works natively on tables instead of forcing a continuous relaxation."
    - "Training then reduces to matching sufficient statistics, and the objective is exactly a Bregman divergence — which is why continuous columns get an MSE-like loss and categorical ones a cross-entropy-like loss, for free."
  summary: >
    A single table usually mixes continuous, binary and categorical variables, and each
    column has its own geometry and its own natural loss. Variational Flow Matching lets
    us pick a tractable variational distribution per column; choosing exponential families
    makes the objective column-aware but unified. The gradient depends only on the gap
    between sufficient statistics under the posterior path and those predicted by the
    model, and the whole objective turns out to be the Bregman divergence induced by
    the convex dual of the log-partition function. TabbyFlow, built on this framework,
    reaches state of the art on standard tabular benchmarks.

